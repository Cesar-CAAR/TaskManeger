<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskManager | Tablero</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/modules/board.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>
  <main class="page-content">
<section>
  <header class="page-header">
    <div>
      <h1>Tablero de estrategia de producto</h1>
      <p>Planificación trimestral y desarrollo del roadmap.</p>
    </div>
  </header>

  <div class="board-toolbar">
    <input id="task-search" class="search-input" type="search" placeholder="Buscar tareas..." />
    <button id="create-task-button" class="primary-button" type="button">+ Crear tarea</button>
  </div>

  <section class="board-grid">
    <article class="board-column" data-status="todo">
      <div class="column-header">
        <h2>Por hacer</h2>
        <span id="count-todo" class="column-count">0</span>
      </div>
      <div id="column-todo" class="column-tasks"></div>
    </article>

    <article class="board-column" data-status="in_progress">
      <div class="column-header">
        <h2>En progreso</h2>
        <span id="count-in-progress" class="column-count">0</span>
      </div>
      <div id="column-in-progress" class="column-tasks"></div>
    </article>

    <article class="board-column" data-status="done">
      <div class="column-header">
        <h2>Finalizadas</h2>
        <span id="count-done" class="column-count">0</span>
      </div>
      <div id="column-done" class="column-tasks"></div>
    </article>
  </section>

  <dialog id="create-task-dialog" class="task-create-dialog">
    <form id="create-task-form" method="dialog">
      <h2>Nueva tarea</h2>
      <div class="form-group">
        <label for="create-task-title">Título</label>
        <input id="create-task-title" type="text" required placeholder="Nombre de la tarea" />
      </div>
      <div class="form-group">
        <label for="create-task-status">Columna</label>
        <select id="create-task-status">
          <option value="todo">Por hacer</option>
          <option value="in_progress">En progreso</option>
          <option value="done">Finalizadas</option>
        </select>
      </div>
      <div class="panel-actions">
        <button class="secondary-button" type="button" id="cancel-create-task">Cancelar</button>
        <button class="primary-button" type="submit">Crear</button>
      </div>
    </form>
  </dialog>

  <aside id="task-panel" class="task-panel hidden" aria-label="Detalle de tarea">
    <div class="task-panel-header">
      <div>
        <small id="task-panel-meta" class="muted">Detalle</small>
        <h2 id="task-panel-title">Detalle de tarea</h2>
      </div>
      <button id="close-task-panel" class="icon-button" type="button" aria-label="Cerrar">✕</button>
    </div>

    <form id="task-detail-form" class="task-panel-form">
      <input id="task-id" type="hidden" />

      <div class="form-group">
        <label for="task-title">Título</label>
        <input id="task-title" type="text" required />
      </div>

      <div class="form-group">
        <label for="task-status">Columna</label>
        <select id="task-status">
          <option value="todo">Por hacer</option>
          <option value="in_progress">En progreso</option>
          <option value="done">Finalizadas</option>
        </select>
      </div>

      <div class="form-group">
        <label for="task-category">Categoría</label>
        <input id="task-category" type="text" placeholder="Investigación, Diseño..." />
      </div>

      <div class="form-group">
        <label for="task-priority">Prioridad</label>
        <select id="task-priority">
          <option>Crítica</option>
          <option>Alta</option>
          <option selected>Media</option>
          <option>Baja</option>
        </select>
      </div>

      <div class="form-group">
        <label for="task-date">Fecha límite</label>
        <input id="task-date" type="date" />
      </div>

      <div class="form-group">
        <label for="task-assignee">Responsable</label>
        <input id="task-assignee" type="text" placeholder="Nombre del responsable" />
      </div>

      <div class="form-group">
        <label for="task-description">Descripción</label>
        <textarea id="task-description" rows="6" placeholder="Describe la tarea..."></textarea>
      </div>

      <div class="panel-actions">
        <button class="secondary-button" type="button" id="draft-task-button">Guardar borrador</button>
        <button class="primary-button" type="submit">Guardar cambios</button>
      </div>
    </form>
  </aside>
</section>

  </main>
</div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="../../js/core/app.js"></script>
  <script src="../../js/pages/board.js"></script>
</body>
</html>
