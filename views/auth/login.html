<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskManager | Iniciar sesión</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/modules/auth.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
<main class="auth-page">
  <section class="auth-container">
    <h1 class="auth-logo">TaskManager</h1>
    <p class="auth-subtitle">Organiza tus tareas de forma simple.</p>

    <form id="login-form" class="auth-card">
      <div>
        <h2>Iniciar sesión</h2>
        <p class="muted compact">Accede a tu espacio de trabajo.</p>
      </div>

      <div class="form-group">
        <label for="login-email">Correo electrónico</label>
        <input id="login-email" type="email" placeholder="nombre@correo.com" required />
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input id="login-password" type="password" placeholder="********" required />
      </div>

      <label class="checkbox-label">
        <input type="checkbox" />
        Mantener la sesión iniciada
      </label>

      <button class="primary-button" type="submit">Iniciar sesión</button>

      <div class="auth-divider">O</div>

      <button class="secondary-button" type="button">Continuar con Google</button>

      <p id="login-message" class="form-message" aria-live="polite"></p>

      <p class="auth-link">
        ¿No tienes una cuenta?
        <a href="register.html">Regístrate gratis</a>
      </p>
    </form>
  </section>
</main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="../../js/core/app.js"></script>
  <script src="../../js/pages/login.js"></script>
</body>
</html>
