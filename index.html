<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager | Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-container">
      <h1>TaskManager</h1>
      <p class="subtitle">Organiza tus tareas de forma simple.</p>
      <form id="login-form" class="login-card">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="nombre@correo.com" required>
        <div class="password-row">
          <label for="password">Contraseña</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <input id="password" type="password" placeholder="********" required>
        <label class="remember"><input type="checkbox"> Mantener la sesión iniciada</label>
        <button type="submit" class="primary">Iniciar sesión</button>
        <p class="divider">O</p>
        <button type="button" class="secondary">Continuar con Google</button>
      </form>
      <p class="register">¿No tienes una cuenta? <a href="#">Regístrate gratis</a></p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
